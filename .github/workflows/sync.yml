name: Synka matchschema
on: { schedule: [ { cron: '41 5 * * *' } ], workflow_dispatch: {} }
permissions: { contents: read }
jobs: { sync: { runs-on: ubuntu-latest, timeout-minutes: 5, steps: [ { uses: actions/checkout@v7 }, { name: Hamta schemat, run: node scripts/sync.mjs, env: { SUPABASE_URL: '${{ secrets.SUPABASE_URL }}', SUPABASE_SERVICE_ROLE_KEY: '${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}' } } ] } }
